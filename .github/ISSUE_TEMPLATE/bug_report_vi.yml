name: Báo lỗi (Tiếng Việt)
description: Báo một lỗi có thể tái lập.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Release hoặc commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cách tái lập
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Xóa credential và private data.
    validations:
      required: true
